<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HA Voice — голоса и дневник</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main>
    <h1>HA Voice</h1>
    <p class="sub">Enrollment голосов · дневник комнаты · отсечение ТВ</p>

    <section>
      <h2>Дневник</h2>
      <label class="row">
        <input type="checkbox" id="diaryEnabled" />
        Непрерывная расшифровка
      </label>
      <p id="diaryStatus" class="muted"></p>
    </section>

    <section>
      <h2>Записать голос</h2>
      <div class="row">
        <input id="speakerName" type="text" placeholder="Имя (папа, мама…)" />
        <button id="recBtn" type="button">Запись 4 с</button>
        <button id="enrollBtn" type="button" disabled>Сохранить</button>
      </div>
      <p id="enrollMsg" class="muted"></p>
    </section>

    <section>
      <h2>Спикеры</h2>
      <ul id="speakers"></ul>
    </section>

    <section>
      <h2>Последние реплики</h2>
      <button id="refreshBtn" type="button">Обновить</button>
      <ul id="dialogues"></ul>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
