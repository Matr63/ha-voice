<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HA Voice</title>
  <link rel="stylesheet" href="__BASE__/static/styles.css?v=__VERSION__" />
  <script>window.HV_BASE = "__BASE__"; window.HV_VERSION = "__VERSION__";</script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h2"/><path d="M6 8v8"/><path d="M10 4v16"/><path d="M14 7v10"/><path d="M18 9v6"/><path d="M22 12h-2"/></svg>
        </div>
        <div>
          <div class="brand-title">HA Voice</div>
          <div class="brand-sub">колонка · wake word · GigaAM · Kokoro · ассистент</div>
        </div>
      </div>
      <div class="pills" id="pills"></div>
    </header>

    <nav class="tabs" id="tabs" role="tablist">
      <button type="button" data-tab="speaker">Колонка</button>
      <button type="button" data-tab="diary">Дневник</button>
      <button type="button" data-tab="voices">Голоса</button>
      <button type="button" data-tab="tts">Озвучка</button>
      <button type="button" data-tab="assistant">Ассистент</button>
      <button type="button" data-tab="settings">Настройки</button>
    </nav>

    <main>
      <section class="view" data-view="speaker"></section>
      <section class="view" data-view="diary"></section>
      <section class="view" data-view="voices"><div id="voicesMain"></div><div id="voicesTest"></div></section>
      <section class="view" data-view="tts"></section>
      <section class="view" data-view="assistant"></section>
      <section class="view" data-view="settings"></section>
    </main>

    <footer class="footer muted" id="footer"></footer>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="__BASE__/static/app.js?v=__VERSION__"></script>
</body>
</html>
