name: HA Voice
version: "2.2.7"
slug: ha_voice
description: >-
  Голосовой ассистент на ПК для колонки Waveshare: плата — микрофон и динамик,
  здесь — wake word, GigaAM, узнавание голосов, дневник, ИИ для дома и Kokoro.
  Первая установка 10–30+ мин (torch) — смотрите Log дополнения, строки [ha-voice N/6].
url: https://github.com/Matr63/ha-voice
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8088
panel_icon: mdi:microphone-message
panel_title: HA Voice
homeassistant_api: true
hassio_api: true
hassio_role: default
# USB serial ports of the HA machine: first flash of a satellite board from the panel
uart: true
discovery:
  - ha_voice
ports:
  10500/tcp: 10500
  8088/tcp: 8088
  10305/tcp: 10305
  10350/tcp: 10350
  10351/tcp: 10351
ports_description:
  10500/tcp: Колонка HA Voice (прошивка спутника)
  8088/tcp: API / UI (интеграция HA Voice)
  10305/tcp: Wyoming STT GigaAM — необязательно
  10350/tcp: Wyoming STT через фильтр голосов — необязательно, для Assist
  10351/tcp: Wyoming TTS Kokoro-ru — необязательно, для Assist
map:
  - addon_config:rw
  - homeassistant_config:rw
  - media:rw
  - share:rw
options:
  stt_model: gigaam-v3-e2e-rnnt
  stt_quantization: int8
  stt_device: cpu
  gate_threshold: 0.55
  gate_require_match: true
  diary_vad_rms: 0.012
  tts_enabled: true
  tts_voice: sveta
schema:
  stt_model: str
  stt_quantization: list(int8|fp16|fp32)
  stt_device: list(cpu|cuda)
  gate_threshold: float
  gate_require_match: bool
  diary_vad_rms: float
  tts_enabled: bool
  tts_voice: list(sveta|masha|dima)
  hf_endpoint: str?
